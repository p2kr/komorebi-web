<!DOCTYPE html>
<html>
<head>
    <title>Authenticating...</title>
</head>
<body>
    <p>Authenticating... this window should close automatically.</p>
    <script>
        const queryParams = new URLSearchParams(window.location.search);

        // 2. Authorization Code flow → credential in query string
        const code  = queryParams.get("code");
        const error = queryParams.get("error");

        // 3. Implicit / Token flow → credential in hash fragment
        const hashParams = new URLSearchParams(window.location.hash.slice(1)); // strip leading #
        const accessToken = hashParams.get("access_token");
        const hashError   = hashParams.get("error");

        // 4. Resolve: whichever flow was used
        const resolvedCode  = code  || accessToken  || null;
        const resolvedError = error || hashError     || null;

        const stateParam = queryParams.get("state") || hashParams.get("state");

        if (window.opener && stateParam) {
            try {
                const stateData   = JSON.parse(decodeURIComponent(stateParam));
                const targetOrigin = new URL(stateData.origin).origin;
                const provider     = stateData.provider;

                window.opener.postMessage({
                    type: "OAUTH_CALLBACK",
                    provider,
                    code:  resolvedCode,   // ← both flows use this field
                    error: resolvedError
                }, targetOrigin);

            } catch (err) {
                console.error("Invalid state parameter payload.");
            }
        }

        window.close();
    </script>
</body>
</html>
